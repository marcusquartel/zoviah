name: CI

# Runs the full gate on every push and PR. No deploy, no secrets, no paid API
# calls — `npm test` is mock-only for Anthropic. Inert until this repository
# has a GitHub remote; see docs/production-readiness.md.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (0 real Anthropic calls)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A placeholder so `next build` never treats a missing public URL as
          # a hard error in CI. Not used at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
